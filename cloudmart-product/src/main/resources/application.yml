server:
  port: 8082
  tomcat:
    threads:
      max: 500

springdoc:
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

spring:
  application:
    name: cloudmart-product
  datasource:
    url: jdbc:mysql://localhost:3307/cloudmart?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        import-check:
          enabled: false
mybatis-plus:
  global-config:
    db-config:
      id-type: auto          # 主键自增
      logic-delete-field: deleted   # 逻辑删除字段名
      logic-delete-value: 1         # 已删除值
      logic-not-delete-value: 0     # 未删除值
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
